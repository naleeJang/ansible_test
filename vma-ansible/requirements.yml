---
# AAP 2.6 Execution Environment에 설치할 collections
# Project Sync 시 자동으로 설치됨
collections:
  # Red Hat 인증 collection (AAP 지원)
  - name: vmware.vmware
    version: ">=1.10.0"

  # 디스크/네트워크 등 세부 정보 수집용 (community)
  - name: community.vmware
    version: ">=5.2.0"

  # OpenShift Virtualization 리소스 조작 (다음 단계용)
  - name: kubernetes.core
    version: ">=5.0.0"

  - name: redhat.openshift_virtualization
    version: ">=1.0.0"

  # 유틸리티
  - name: ansible.utils
    version: ">=5.0.0"
